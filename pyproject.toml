[project]
name = "aha-mcp"
version = "3.0.0"
description = "MCP server for Aha! product management — 10 unified tools with flexible identifiers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx",
    "python-dotenv",
    "markdown>=3.5",
    "markdownify>=0.13",
    "starlette",
    "uvicorn",
    "authlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
]

[project.scripts]
aha-mcp = "aha_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
